name: Publish Video Catcher v0.6.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.6.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('<p dir="rtl"><strong>גרסה נוכחית:</strong> <code dir="ltr">v0.6.0</code></p>', '<p dir="rtl"><strong>גרסה נוכחית:</strong> <code dir="ltr">v0.6.1</code></p>')
          p.write_text(s)
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update README version to v0.6.1"
            git push
          fi

      - name: Build extension ZIP
        run: |
          zip -r video-catcher-v0.6.1.zip \
            manifest.json \
            background.js \
            offscreen.js \
            offscreen.html \
            sidepanel.js \
            sidepanel.html \
            sidepanel.css \
            icons \
            README.md \
            LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create video-catcher-v0.6.1 \
            video-catcher-v0.6.1.zip \
            --target main \
            --title "video-catcher-v0.6.1" \
            --notes-file RELEASE_NOTES_v0.6.1.md \
            --latest
