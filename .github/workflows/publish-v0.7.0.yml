## חדש ושופר

- החלונית מציגה בבירור איזה טאב ואיזה URL נסרקים כרגע.
- מעבר בין טאבים מעדכן אוטומטית את הקשר הסריקה.
- ניווט לדף אחר באותו טאב מאפס מצב UI ישן ומונע הצגת "הורד שוב" עבור סרטון שלא הורד בדף החדש.
- משימות HLS משויכות כעת ל־Tab ID ול־URL של הדף כדי למנוע זליגת סטטוס בין דפים.
- כפתור הרענון קורא מחדש את הטאב הפעיל וה־URL לפני הסריקה.
- תוקן ה־duration במטא־דאטה של קובצי MP4 מפוצלים כך שכל חלק מדווח על משכו האמיתי.
- הוסרה שורת הפרטיות מה־footer של החלונית.

## הורדה מפוצלת

הפיצול נשאר מוגבל לעד 200MB לכל קובץ (עם מרווח ביטחון פנימי), ונועד לשימוש נוח יותר עם שירותי AI כגון NotebookLM.
''', encoding='utf-8')
