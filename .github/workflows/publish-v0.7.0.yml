name: Publish Video Catcher v0.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.7.0.yml'

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.7.0 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Version
          replace_once('manifest.json', '"version": "0.6.1"', '"version": "0.7.0"')

          # Side panel: explicit tab context + remove privacy footer line.
          replace_once(
              'sidepanel.html',
              '      <div class="page" id="pageLine">מחפש וידאו בעמוד…</div>',
              '''      <div class="tabContext" id="tabContext">
        <div class="tabContextTop">
          <span class="tabDot" aria-hidden="true"></span>
          <strong id="tabContextLabel">הטאב שנסרק</strong>
        </div>
        <div class="tabTitle" id="tabTitle">מחפש טאב פעיל…</div>
        <div class="page" id="pageLine">—</div>
      </div>'''
          )
          replace_once(
              'sidepanel.html',
              '      <div class="privacyNote">פרטיות: העיבוד מתבצע מקומית בדפדפן. כתובות העמוד והמדיה משמשות רק לזיהוי ולהורדה ואינן נשלחות למפתח התוסף.</div>\n',
              ''
          )

          # Side panel styles.
          replace_once(
              'sidepanel.css',
              '.page{margin-top:11px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}',
              '.tabContext{margin-top:11px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--card2)}.tabContextTop{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;color:var(--muted)}.tabContextTop strong{font-size:10px;color:var(--accent);font-weight:750}.tabDot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 12%,transparent)}.tabTitle{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.page{margin-top:3px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}'
          )
          p = Path('sidepanel.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\n.privacyNote{color:var(--muted);font-size:9px;line-height:1.5;opacity:.72;max-width:390px;margin:0 auto 7px}\n', '\n')
          p.write_text(s, encoding='utf-8')

          # Side panel JS: bind UI state to tab + page URL and refresh context before scans.
