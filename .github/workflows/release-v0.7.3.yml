name: Release Video Catcher v0.7.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.7.3.yml'

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.7.3 changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # manifest
          p=Path('manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['version']='0.7.3'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # sidepanel HTML: add split estimate line
          p=Path('sidepanel.html')
          s=p.read_text(encoding='utf-8')
          needle='''        </div>\n\n        <button id="download" class="primary">'''
          repl='''        </div>\n        <div id="splitEstimate" class="splitEstimate hidden"></div>\n\n        <button id="download" class="primary">'''
          if 'id="splitEstimate"' not in s:
              if needle not in s: raise SystemExit('sidepanel.html insertion point not found')
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          # sidepanel JS: estimate part count from existing size estimate
          p=Path('sidepanel.js')
          s=p.read_text(encoding='utf-8')
          old='''function updateSplitAvailability(){\n  const c=choices[Number($(\'quality\').value)||0];\n  const supported=!!splitChoiceFor(c);\n  $(\'splitDownload\').disabled=!supported;\n  $(\'splitOption\').classList.toggle(\'disabled\',!supported);\n  if(!supported)$(\'splitDownload\').checked=false;\n}'''
          new='''function updateSplitEstimate(){\n  const box=$(\'splitEstimate\');\n  if(!box)return;\n  const selected=choices[Number($(\'quality\').value)||0];\n  const source=splitChoiceFor(selected);\n  const enabled=$(\'splitDownload\').checked&&!$(\'splitDownload\').disabled&&!!source;\n  if(!enabled){box.classList.add(\'hidden\');box.textContent=\'\';return;}\n  const bytes=estimateSize(source);\n  if(!(bytes>0)){box.classList.add(\'hidden\');box.textContent=\'\';return;}\n  const parts=Math.max(1,Math.ceil(bytes/MAX_SPLIT_BYTES));\n  box.textContent=parts===1?\'הערכה: קובץ אחד\':`הערכה: כ־${parts} קבצים`;\n  box.classList.remove(\'hidden\');\n}\nfunction updateSplitAvailability(){\n  const c=choices[Number($(\'quality\').value)||0];\n  const supported=!!splitChoiceFor(c);\n  $(\'splitDownload\').disabled=!supported;\n  $(\'splitOption\').classList.toggle(\'disabled\',!supported);\n  if(!supported)$(\'splitDownload\').checked=false;\n  updateSplitEstimate();\n}'''
          if 'function updateSplitEstimate()' not in s:
              if old not in s: raise SystemExit('updateSplitAvailability block not found')
              s=s.replace(old,new,1)
          oldbind="$('quality').onchange=updateSplitAvailability;$('splitInfo').onclick=toggleSplitInfo;"
          newbind="$('quality').onchange=updateSplitAvailability;$('splitDownload').onchange=updateSplitEstimate;$('splitInfo').onclick=toggleSplitInfo;"
          if "$('splitDownload').onchange=updateSplitEstimate" not in s:
              if oldbind not in s: raise SystemExit('event binding not found')
              s=s.replace(oldbind,newbind,1)
          p.write_text(s,encoding='utf-8')

          # CSS for estimate
          p=Path('sidepanel.css')
          s=p.read_text(encoding='utf-8')
          if '.splitEstimate{' not in s:
              s += '\n/* v0.7.3: split file-count estimate */\n.splitEstimate{margin:7px 18px 0;font-size:10.5px;line-height:1.4;color:var(--muted);font-weight:650}\n'
          p.write_text(s,encoding='utf-8')

          # offscreen: save split downloads in a dedicated Downloads subfolder
          p=Path('offscreen.js')
          s=p.read_text(encoding='utf-8')
          old='''function sanitizeFilename(name, ext) {\n  const base = String(name || 'Video').replace(/[<>:\"/\\\\|?*\\x00-\\x1F]/g, '_').replace(/\\s+/g, ' ').trim().slice(0, 170) || 'Video';\n  return `${base}.${ext}`;\n}'''
          new='''function sanitizeFilename(name, ext) {\n  const base = String(name || 'Video').replace(/[<>:\"/\\\\|?*\\x00-\\x1F]/g, '_').replace(/\\s+/g, ' ').trim().slice(0, 170) || 'Video';\n  return `${base}.${ext}`;\n}\nfunction sanitizeFolderComponent(name) {\n  const base=String(name||'וידאו').replace(/[<>:\"/\\\\|?*\\x00-\\x1F]/g,'_').replace(/\\s+/g,' ').trim().replace(/[. ]+$/g,'').slice(0,100);\n  return base||'וידאו';\n}'''
          if 'function sanitizeFolderComponent' not in s:
              if old not in s: raise SystemExit('sanitizeFilename block not found')
              s=s.replace(old,new,1)
          old='''    for(let i=0;i<outputs.length;i++){\n      if(job.cancelled)throw new Error('ההורדה בוטלה.');\n      const out=outputs[i];'''
          new='''    const splitFolder=split?`Video Catcher/${sanitizeFolderComponent(title||'וידאו')}`:'';\n    for(let i=0;i<outputs.length;i++){\n      if(job.cancelled)throw new Error('ההורדה בוטלה.');\n      const out=outputs[i];'''
          if 'const splitFolder=split?' not in s:
              if old not in s: raise SystemExit('output loop start not found')
              s=s.replace(old,new,1)
          old="      const filename=sanitizeFilename(`${title || 'וידאו'}${quality ? ` - ${quality}` : ''}${suffix}`,ext);"
          new="      const baseFilename=sanitizeFilename(`${title || 'וידאו'}${quality ? ` - ${quality}` : ''}${suffix}`,ext);\n      const filename=split?`${splitFolder}/${baseFilename}`:baseFilename;"
          if 'const baseFilename=sanitizeFilename' not in s:
              if old not in s: raise SystemExit('filename line not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # README
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          if 'הצגת הערכה של מספר הקבצים שייווצרו לפני התחלת הורדה מפוצלת' not in s:
              s=s.replace('  <li><strong>הורדה מפוצלת</strong> לקבצים בגודל של עד <span dir="ltr">200MB</span></li>', '  <li><strong>הורדה מפוצלת</strong> לקבצים בגודל של עד <span dir="ltr">200MB</span></li>\n  <li>הצגת הערכה של מספר הקבצים שייווצרו לפני התחלת הורדה מפוצלת</li>')
          if 'Downloads/Video Catcher' not in s:
              s=s.replace('  <li>שמות הקבצים מסודרים לפי הסדר, לדוגמה: <code dir="ltr">part-01-of-03</code>.</li>', '  <li>שמות הקבצים מסודרים לפי הסדר, לדוגמה: <code dir="ltr">part-01-of-03</code>.</li>\n  <li>בהורדה מפוצלת כל הקבצים נשמרים יחד בתיקייה <code dir="ltr">Downloads/Video Catcher/&lt;שם הסרטון&gt;/</code>.</li>\n  <li>לפני ההורדה מוצגת הערכה של מספר הקבצים הצפוי לפי גודל ההורדה המשוער והתקרה הפנימית לכל חלק.</li>')
          s=s.replace('<code dir="ltr">v0.7.2</code>','<code dir="ltr">v0.7.3</code>')
          p.write_text(s,encoding='utf-8')

          Path('RELEASE_NOTES_v0.7.3.md').write_text('''# Video Catcher v0.7.3\n\n## מה השתנה\n\n- בהורדה מפוצלת, כל חלקי הסרטון נשמרים כעת יחד בתוך `Downloads/Video Catcher/<שם הסרטון>/`.\n- הורדות רגילות נשארות בתיקיית Downloads כרגיל.\n- כאשר מצב הורדה מפוצלת פעיל ויש מספיק נתונים, מוצגת לפני ההורדה הערכה של מספר הקבצים שייווצרו.\n- ההערכה מבוססת על גודל הווידאו המשוער ועל תקרה פנימית של כ־195MB לחלק, ולכן המספר בפועל עשוי להשתנות מעט בהתאם לגבולות מקטעי HLS.\n- כולל את מנגנון בדיקת העדכונים, נעילת החלונית ומצב "אתר זה לא נתמך" מהגרסאות הקודמות.\n''',encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check sidepanel.js
          node --check lockcontext.js
          node --check background.js
          node --check offscreen.js
          python3 -m json.tool manifest.json >/dev/null
          grep -q '"version": "0.7.3"' manifest.json
          grep -q 'id="splitEstimate"' sidepanel.html
          grep -q 'updateSplitEstimate' sidepanel.js
          grep -q 'Video Catcher/${sanitizeFolderComponent' offscreen.js

      - name: Commit changes
        run: |
          git config user.name "WillyW0nka99"
          git config user.email "nettle.0-dietary@icloud.com"
          git add manifest.json sidepanel.html sidepanel.js sidepanel.css offscreen.js README.md RELEASE_NOTES_v0.7.3.md
          git commit -m "Release Video Catcher v0.7.3"
          git push

      - name: Build release ZIP
        run: |
          zip -r video-catcher-v0.7.3.zip . -x '.git/*' '.github/*' 'video-catcher-v0.7.3.zip'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create video-catcher-v0.7.3 video-catcher-v0.7.3.zip --target main --title "video-catcher-v0.7.3" --notes-file RELEASE_NOTES_v0.7.3.md --latest
