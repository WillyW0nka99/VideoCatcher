name: Release Video Catcher v0.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.7.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          node --check background.js
          node --check offscreen.js
          node --check sidepanel.js
          python3 -m json.tool manifest.json >/dev/null
          grep -q '"version": "0.7.0"' manifest.json

      - name: Build extension ZIP
        run: |
          zip -r video-catcher-v0.7.0.zip \
            manifest.json \
            background.js \
            offscreen.js \
            offscreen.html \
            sidepanel.js \
            sidepanel.html \
            sidepanel.css \
            icons \
            README.md \
            LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create video-catcher-v0.7.0 \
            video-catcher-v0.7.0.zip \
            --target main \
            --title "video-catcher-v0.7.0" \
            --notes-file RELEASE_NOTES_v0.7.0.md \
            --latest
