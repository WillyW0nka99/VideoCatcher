name: Publish Video Catcher v0.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.6.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension ZIP
        run: |
          zip -r video-catcher-v0.6.0.zip \
            manifest.json \
            background.js \
            offscreen.js \
            offscreen.html \
            sidepanel.js \
            sidepanel.html \
            sidepanel.css \
            icons \
            README.md \
            LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create video-catcher-v0.6.0 \
            video-catcher-v0.6.0.zip \
            --target main \
            --title "video-catcher-v0.6.0" \
            --notes-file RELEASE_NOTES_v0.6.0.md \
            --latest
