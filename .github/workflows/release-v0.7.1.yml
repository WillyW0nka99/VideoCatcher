name: Release Video Catcher v0.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.7.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: |
          node --check sidepanel.js
          node --check lockcontext.js
          node --check background.js
          node --check offscreen.js
          python3 -m json.tool manifest.json >/dev/null
          grep -q '"version": "0.7.1"' manifest.json
          grep -q 'lockcontext.js' sidepanel.html

      - name: Build extension ZIP
        run: |
          zip -r video-catcher-v0.7.1.zip \
            manifest.json background.js offscreen.js offscreen.html \
            sidepanel.js lockcontext.js sidepanel.html sidepanel.css \
            icons README.md LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create video-catcher-v0.7.1 \
            video-catcher-v0.7.1.zip \
            --target main \
            --title "video-catcher-v0.7.1" \
            --notes-file RELEASE_NOTES_v0.7.1.md \
            --latest
