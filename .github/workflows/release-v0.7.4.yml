name: Release Video Catcher v0.7.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.7.4.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: |
          node --check sidepanel.js
          node --check lockcontext.js
          node --check background.js
          node --check offscreen.js
          python3 -m json.tool manifest.json >/dev/null
          grep -q '"version": "0.7.4"' manifest.json
          grep -q 'id="timeLimitOption"' sidepanel.html
          grep -q 'requestedTimeRange' sidepanel.js
          grep -q 'cancelContextDownloads' background.js
          grep -q 'selectSegmentIndicesByTime' offscreen.js

      - name: Build release ZIP
        run: |
          zip -r video-catcher-v0.7.4.zip . -x '.git/*' '.github/*' 'video-catcher-v0.7.4.zip'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create video-catcher-v0.7.4 video-catcher-v0.7.4.zip --target main --title "video-catcher-v0.7.4" --notes-file RELEASE_NOTES_v0.7.4.md --latest
