name: Apply Video Catcher v0.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.7.1.yml'

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.7.1 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Version
          p = Path('manifest.json')
          s = p.read_text(encoding='utf-8').replace('"version": "0.7.0"', '"version": "0.7.1"')
          p.write_text(s, encoding='utf-8')

          # Side panel wording.
          p = Path('sidepanel.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('הטאב שנסרק', 'החלונית הנעולה')
          p.write_text(s, encoding='utf-8')

          p = Path('sidepanel.js')
          s = p.read_text(encoding='utf-8')

          # Persist the locked tab per browser window.
          s = s.replace(
              "let panelWindowId = null;\nconst MAX_SPLIT_BYTES = 195000000;",
              "let panelWindowId = null;\nconst LOCK_KEY = 'vsc_locked_tab_by_window';\nconst MAX_SPLIT_BYTES = 195000000;"
          )

          s = s.replace(
              "async function getActiveTabSnapshot(){\n  const windowId=await getPanelWindowId();\n  const r=await chrome.runtime.sendMessage({type:'getActiveTab',windowId}).catch(()=>null);\n  return r?.tab||null;\n}",
              """async function getActiveTabSnapshot(){
  const windowId=await getPanelWindowId();
  const r=await chrome.runtime.sendMessage({type:'getActiveTab',windowId}).catch(()=>null);
  return r?.tab||null;
}
async function getTabSnapshot(tabId){
  const r=await chrome.runtime.sendMessage({type:'getTab',tabId}).catch(()=>null);
  return r?.tab||null;
}
async function saveLockedTab(tab){
  const windowId=await getPanelWindowId();
  if(windowId==null||!tab?.id)return;
  const d=await chrome.storage.session.get(LOCK_KEY).catch(()=>({}));
  const map={...(d?.[LOCK_KEY]||{})};
  map[String(windowId)]={tabId:tab.id,lockedAt:Date.now()};
  await chrome.storage.session.set({[LOCK_KEY]:map}).catch(()=>{});
}
async function loadLockedTab(){
  const windowId=await getPanelWindowId();
  if(windowId==null)return null;
  const d=await chrome.storage.session.get(LOCK_KEY).catch(()=>({}));
  const saved=d?.[LOCK_KEY]?.[String(windowId)];
  if(!Number.isInteger(saved?.tabId))return null;
  const tab=await getTabSnapshot(saved.tabId);
  return tab?.windowId===windowId?tab:null;
}"""
          )

          replacement = r'''function renderTabContext(tab){
  const number=Number.isInteger(tab?.index)?tab.index+1:null;
  $('tabContextLabel').textContent=number?`חלונית ${number} • נעולה`:'חלונית נעולה';
  $('tabTitle').textContent=tab?.title||'ללא כותרת';
  $('pageLine').textContent=tab?.url||'כתובת לא זמינה';
}
function resetContextUi(){
  currentTaskId=null;
  currentDirectDownloadId=null;
  lastTaskUpdateAt=0;
  currentTaskStatus='';
  allItems=[];
  choices=[];
  subtitles=[];
  $('downloadText').textContent='הורד וידאו';
  $('download').disabled=false;
  setCancelVisible(false);
  $('progressBox').classList.add('hidden');
  $('stallHint').classList.add('hidden');
  $('bar').style.width='0%';
  $('progressPct').textContent='0%';
  $('progressLabel').textContent='מוריד…';
  $('progressDetail').textContent='';
  $('videoCard').classList.add('hidden');
  $('empty').classList.add('hidden');
  $('subtitleSection').classList.add('hidden');
  $('tech').textContent='';
}

async function adoptLockedTab(tab,{save=true}={}){
  const nextKey=contextKeyFor(tab);
  const changed=nextKey!==contextKey;
  activeTab=tab;
  if(changed){
    contextKey=nextKey;
    resetContextUi();
  }
  renderTabContext(tab);
  if(save&&tab?.id)await saveLockedTab(tab);
  if(!tab?.id){setStatus('אין חלונית נעולה','עבור לחלונית נתמכת ולחץ על רענון.');return false;}
  return true;
}

async function restoreTaskForLockedContext(){
  if(!activeTab?.id)return;
  const r=await chrome.runtime.sendMessage({type:'getTasks'}).catch(()=>null);
  const tasks=Object.values(r?.tasks||{}).filter(t=>Number(t?.tabId)===activeTab.id&&normalizePageUrl(t?.pageUrl||'')===normalizePageUrl(activeTab.url||''));
  tasks.sort((a,b)=>Number(b?.updatedAt||b?.startedAt||0)-Number(a?.updatedAt||a?.startedAt||0));
  const t=tasks[0];
  if(!t)return;
  currentTaskId=t.id;currentTaskStatus=t.status;lastTaskUpdateAt=Number(t.updatedAt||Date.now());$('stallHint').classList.add('hidden');
  const labels={starting:'מתחיל',preparing:'מכין',downloading:'מוריד',assembling:'מעבד וידאו',saving:'שומר',done:'הושלם',error:'שגיאה',cancelling:'מבטל',cancelled:'בוטל'};
  setProgress(t.progress||0,labels[t.status]||t.status,t.detail||'');
  const running=['starting','preparing','downloading','assembling','saving','cancelling'].includes(t.status);
  setCancelVisible(running);
  if(running){$('downloadText').textContent='מוריד…';$('download').disabled=true;}
  if(t.status==='done'){$('downloadText').textContent='הורד שוב';$('download').disabled=false;setCancelVisible(false);}
  if(t.status==='error'){$('downloadText').textContent='נסה שוב';$('download').disabled=false;setCancelVisible(false);}
  if(t.status==='cancelled'){$('downloadText').textContent='הורד וידאו';$('download').disabled=false;setCancelVisible(false);currentTaskId=null;}
}

async function scanLockedTab(){
  if(!activeTab?.id)return;
  const expectedKey=contextKey;
  setStatus('סורק את החלונית הנעולה','מחפש וידאו וכתובות מדיה בחלונית שמופיעה למעלה…');
  await chrome.runtime.sendMessage({type:'scanTab',tabId:activeTab.id}).catch(()=>null);
  if(expectedKey!==contextKey)return;
  await loadStreams(expectedKey);
  if(expectedKey===contextKey)await restoreTaskForLockedContext();
}

async function refreshToActiveAndScan(){
  const next=await getActiveTabSnapshot();
  if(!next?.id){setStatus('אין חלונית פעילה','פתח עמוד נתמך ונסה שוב.');return;}
  await adoptLockedTab(next);
  await scanLockedTab();
}

async function rescanLockedTab(){
  if(!activeTab?.id){await refreshToActiveAndScan();return;}
  const latest=await getTabSnapshot(activeTab.id);
  if(!latest){setStatus('החלונית הנעולה נסגרה','עבור לחלונית אחרת ולחץ על כפתור הרענון למעלה.');return;}
  const oldKey=contextKey;
  await adoptLockedTab(latest);
  if(oldKey!==contextKey)await chrome.runtime.sendMessage({type:'clearStreams',tabId:latest.id}).catch(()=>null);
  await scanLockedTab();
}
'''
          pattern = r"function renderTabContext\(tab\)\{.*?\nasync function scan\(\)\{\n  const ok=await syncActiveTab\(\);\n  if\(ok\)await scanCurrentTab\(\);\n\}\n"
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Failed to replace tab context/scan block')

          # Tab activation/navigation events must never switch the locked context automatically.
          s = s.replace(
              """  if(m.type==='tabContextChanged'){
    if(activeTab?.windowId!=null&&m.windowId!=null&&activeTab.windowId!==m.windowId)return;
    syncActiveTab({scanAfter:m.reason!=='title'}).catch(()=>{});
    return;
  }""",
              """  if(m.type==='tabContextChanged'){
    // The panel stays locked. Only the explicit refresh button may adopt another browser tab.
    return;
  }"""
          )

          # Init restores the locked tab even if the side panel document was recreated.
          s = s.replace(
              """async function init(){
  $('versionLabel').textContent=`v${chrome.runtime.getManifest().version}`;
  const ok=await syncActiveTab();
  if(ok)await scanCurrentTab();
}
$('refresh').onclick=scan;$('scanAgain').onclick=scan;$('download').onclick=doDownload;$('cancelDownload').onclick=cancelDownload;$('downloadSubtitle').onclick=downloadSubtitle;$('downloadDebug').onclick=downloadDebug;$('quality').onchange=updateSplitAvailability;$('splitInfo').onclick=toggleSplitInfo;$('clear').onclick=async()=>{if(!activeTab?.id)return;await chrome.runtime.sendMessage({type:'clearStreams',tabId:activeTab.id});resetContextUi();renderTabContext(activeTab);setStatus('נוקו הזיהויים','לחץ על סריקה מחדש כדי לחפש שוב בטאב הנוכחי.')};init();""",
              """async function init(){
  $('versionLabel').textContent=`v${chrome.runtime.getManifest().version}`;
  const saved=await loadLockedTab();
  if(saved){
    await adoptLockedTab(saved,{save:false});
    await scanLockedTab();
    return;
  }
  await refreshToActiveAndScan();
}
$('refresh').onclick=refreshToActiveAndScan;$('scanAgain').onclick=rescanLockedTab;$('download').onclick=doDownload;$('cancelDownload').onclick=cancelDownload;$('downloadSubtitle').onclick=downloadSubtitle;$('downloadDebug').onclick=downloadDebug;$('quality').onchange=updateSplitAvailability;$('splitInfo').onclick=toggleSplitInfo;$('clear').onclick=async()=>{if(!activeTab?.id)return;await chrome.runtime.sendMessage({type:'clearStreams',tabId:activeTab.id});resetContextUi();renderTabContext(activeTab);setStatus('נוקו הזיהויים','לחץ על סריקה מחדש כדי לחפש שוב בחלונית הנעולה.')};init();"""
          )

          # All visible wording uses "חלונית" rather than "טאב".
          s = s.replace('טאב', 'חלונית').replace('טאבים', 'חלוניות')
          p.write_text(s, encoding='utf-8')

          # Background: allow the side panel to resolve its locked tab by ID.
          p = Path('background.js')
          s = p.read_text(encoding='utf-8')
          needle = """    if (m?.type === 'scanTab') {
      const count = await scanTab(Number(m.tabId));
      sendResponse({ ok: true, count }); return;
    }"""
          insert = """    if (m?.type === 'getTab') {
      try {
        const tab = await chrome.tabs.get(Number(m.tabId));
        sendResponse({ ok: true, tab: tab ? { id: tab.id, windowId: tab.windowId, index: tab.index, url: tab.url || '', title: tab.title || '' } : null });
      } catch (_) {
        sendResponse({ ok: true, tab: null });
      }
      return;
    }
    if (m?.type === 'scanTab') {
      const count = await scanTab(Number(m.tabId));
      sendResponse({ ok: true, count }); return;
    }"""
          if needle not in s:
              raise SystemExit('Failed to find scanTab message block')
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')

          # README wording and behavior documentation.
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('הצגה ברורה של הטאב וה־URL שנסרקים ואיפוס אוטומטי במעבר לדף אחר', 'הצגה ברורה של החלונית וה־URL שאליהם התוסף נעול')
          s = s.replace('החלונית מציגה בחלק העליון את הטאב וה־URL שהיא סורקת. מעבר לטאב אחר או ניווט לדף אחר באותו טאב מעדכנים את ההקשר ומאפסים מצב ישן ששייך לעמוד הקודם.', 'החלונית מציגה בחלק העליון את החלונית וה־URL שאליהם Video Catcher נעול. מעבר לחלונית אחרת ב־Chrome אינו משנה את ההקשר של התוסף ואינו משפיע על הורדה פעילה. רק לחיצה על כפתור הרענון ↻ בחלק העליון מעבירה את הנעילה לחלונית הפעילה באותו רגע. כפתור „סריקה מחדש” סורק שוב את החלונית שכבר נעולה ואינו מחליף חלונית.')
          s = s.replace('טאבים', 'חלוניות').replace('טאב', 'חלונית')
          s = s.replace('<code dir="ltr">v0.7.0</code>', '<code dir="ltr">v0.7.1</code>')
          p.write_text(s, encoding='utf-8')

          Path('RELEASE_NOTES_v0.7.1.md').write_text('''# Video Catcher v0.7.1

## מה השתנה

- החלפת המונח „טאב” ב־„חלונית” בממשק ובתיעוד.
- Side Panel נעול לחלונית אחת ואינו מחליף הקשר כשעוברים בין חלוניות Chrome.
- רק לחיצה על כפתור הרענון ↻ מאמצת את החלונית הפעילה והופכת אותה לחלונית הנעולה החדשה.
- „סריקה מחדש” סורקת את החלונית הנעולה בלבד ואינה מחליפה חלונית.
- הנעילה נשמרת ב־`chrome.storage.session`, כך שגם יצירה מחדש של ה־Side Panel לא מאבדת את החלונית הנעולה.
- שחזור מצב של משימת HLS פעילה או שהסתיימה עבור החלונית וה־URL הנעולים.
- מעבר בין חלוניות אינו מאפס progress או מצב הורדה פעיל.

## התקנה

הורד את קובץ ה־ZIP מתוך Assets של ה־Release, חלץ אותו, הפעל Developer mode ב־`chrome://extensions` וטען את התיקייה באמצעות Load unpacked.
''', encoding='utf-8')
          PY

      - name: Validate extension
        run: |
          node --check sidepanel.js
          node --check background.js
          node --check offscreen.js
          python3 -m json.tool manifest.json >/dev/null
          grep -q '"version": "0.7.1"' manifest.json
          grep -q 'LOCK_KEY' sidepanel.js
          grep -q 'חלונית.*נעולה' sidepanel.js
          grep -q "\$('refresh').onclick=refreshToActiveAndScan" sidepanel.js
          grep -q "\$('scanAgain').onclick=rescanLockedTab" sidepanel.js
          grep -q "m?.type === 'getTab'" background.js

      - name: Commit v0.7.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json sidepanel.html sidepanel.js background.js README.md RELEASE_NOTES_v0.7.1.md
          git commit -m "Lock Video Catcher to one browser panel in v0.7.1"
          git push

      - name: Build extension ZIP
        run: |
          zip -r video-catcher-v0.7.1.zip \
            manifest.json background.js offscreen.js offscreen.html \
            sidepanel.js sidepanel.html sidepanel.css icons README.md LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create video-catcher-v0.7.1 \
            video-catcher-v0.7.1.zip \
            --target main \
            --title "video-catcher-v0.7.1" \
            --notes-file RELEASE_NOTES_v0.7.1.md \
            --latest
